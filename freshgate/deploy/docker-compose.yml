services:
  valkey:
    image: valkey/valkey:8-alpine
    container_name: freshgate-valkey
    restart: unless-stopped
    ports:
      - "6379:6379"
    profiles: ["default", "mock"]

  engine:
    build:
      context: ../engine
      dockerfile: Dockerfile
    container_name: freshgate-engine
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      - TAVILY_API_KEY=${TAVILY_API_KEY:-tvly-mock-key}
      - ENGINE_LLM_BASE_URL=${ENGINE_LLM_BASE_URL:-http://bifrost:8080/v1}
      - ENGINE_LLM_API_KEY=${ENGINE_LLM_API_KEY:-sk-mock}
      - ENGINE_LLM_MODEL_EXTRACT=${ENGINE_LLM_MODEL_EXTRACT:-gpt-4o-mini}
      - ENGINE_LLM_MODEL_JUDGE=${ENGINE_LLM_MODEL_JUDGE:-gpt-4o-mini}
      - ENGINE_API_KEY=${ENGINE_API_KEY:-freshgate-dev-secret-token}
      - ENGINE_PORT=8787
      - ENGINE_DB_PATH=/app/data/engine.db
      - ENGINE_MOCK=${ENGINE_MOCK:-1}
      - ENGINE_VERIFY_TIMEOUT_MS=20000
      - TAVILY_CREDIT_BUDGET_PER_HOUR=300
      - ENGINE_CORS_ORIGINS=*
    volumes:
      - engine-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8787/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
    profiles: ["default", "mock"]

  dashboard:
    build:
      context: ../dashboard
      dockerfile: Dockerfile
    container_name: freshgate-dashboard
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - ENGINE_URL=http://engine:8787
      - ENGINE_API_KEY=${ENGINE_API_KEY:-freshgate-dev-secret-token}
      - NEXT_PUBLIC_DEMO=${NEXT_PUBLIC_DEMO:-1}
    depends_on:
      - engine
    profiles: ["default", "mock"]

  bifrost:
    build:
      context: ../../bifrost
      dockerfile: Dockerfile
    container_name: freshgate-bifrost
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./bifrost/config.json:/etc/bifrost/config.json:ro
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    depends_on:
      - valkey
      - engine
    profiles: ["default"]

volumes:
  engine-data:
